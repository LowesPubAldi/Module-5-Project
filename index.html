<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jason Statham</title>
    <link rel="stylesheet" href="https://cdnis.cloudflare.com/ajax/libs/font-awesome
    /6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>

    <Section id="landing-page">
        <nav>
            <figure>
                <img id="Statham" src="./assets/Statham.jpg" alt="">
            </figure>
            <ul class="nav__link--list">
                <li class="nav__link">
                    <a href="#" class=""
                    nav__link anchor
                    link__hover-effect
                    link__hover-effect--black">Movies
                </a>
                </li>
                <li class="nav__link">
                    <a href="#" class=""
                    nav__link anchor
                    link__hover-effect
                    link__hover-effect--black">Quotes
                </a>
                </li>
                <li class="nav__link">
                    <a href="#" class=""
                    nav__link anchor
                    link__hover-effect
                    link__hover-effect--black">Martial Arts
                </a>
                </li>
            </ul>
        </nav>
        
        <header>
            <div class="header-content">
                <h1 class="title">One of the Worlds Best<span class="highlight">Action Stars!</span> 
                </span>!</h1>
                Find a movie with him!
        </div>
        <div class="search-container">
            <form action="#" method="get">
                <input id="searchBox" type="text" class="search-input" placeholder="Search">
                <p id="noResultsMessage" style="display: none">No results matching your search.</p>
                <button-type="submit" class="search-button">
                    <i class="fas fa-search"></i>
                </button>
            </form>
        </div>
        </header>

<main>
    <div class="container">
        <div class="left-side">
        <h1 id="actor-name">Jason Statham</h1>
        <h2>Diver, Martial Arts Enthusiast</h2>
    </div>
    <div class="right-side">
        <!-- Sorting Options -->
        <label for="sort-options">Sort By:</label>
        <select id="sort-options">
            <option value="disabled selected">Select sorting option</option>
            <option value="a-z">A to Z</option>
            <option value="z-a">Z to A</option>
            <option value="oldest-newest">Oldest to Newest</option>
            <option value="newest-oldest">Newest to Oldest</option>
        </select>
    </div>
    </div>
    </main>
    </Section>

    <footer>
    Copyright 2026 <img id="Copyright" src="./assets/vector-copyright-symbol-icon.webp" alt="">    
    </footer>
</body>
</html>
