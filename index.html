<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hockey Movies</title>
    <link rel="stylesheet" href="https://cdnis.cloudflare.com/ajax/libs/font-awesome
    /6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>

    <Section id="landing-page">
        <nav>
            <figure>
                <img id="Hockey" src="./assets/Hockey Symbol.avif" alt="">
            </figure>
            <ul class="nav__link--list">
                <li class="nav__link">
                    <a href="#" class=""
                    nav__link anchor
                    link__hover-effect
                    link__hover-effect--black">Movies
                </a>
                </li>
                <li class="nav__link">
                    <a href="#" class=""
                    nav__link anchor
                    link__hover-effect
                    link__hover-effect--black">History
                </a>
                </li>
                <li class="nav__link">
                    <a href="#" class=""
                    nav__link anchor
                    link__hover-effect
                    link__hover-effect--black">Leagues
                </a>
                </li>
            </ul>
        </nav>
        
        <header>
            <div class="header-content">
                <h1 class="title">Non-Stop Action with Pucks & <span class="highlight">Sticks</span> 
                </span></h1>
                Several movies available.
        </div>
        <div class="search-container">
            <form action="#" method="get">
                <input id="searchBox" type="text" class="search-input" placeholder="Search">
                <p id="noResultsMessage" style="display: none">No results matching your search.</p>
            <button class="search-button">
                <img src="https://flaticon.com/free-icons/magnifying-glass" 
    title="magnifying glass icons" alt="Search" style="width: 20px; height: 20px;"> 
            </button>
            </form>
        </div>
        </header>

<Main class="section">
    <div class="sort-container">
        <label for="sort-options">Sort By:</label>
        <select id="sort-options">
            <option value="disabled selected">Select sorting option</option>
            <option value="a-z">A to Z</option>
            <option value="z-a">Z to A</option>
            <option value="oldest-newest">Oldest to Newest</option>
            <option value="newest-oldest">Newest to Oldest</option>
        </select>
    </div>
    <div class="image-grid">
        <img src="image1.jpg" alt="Hockey Movie 1" />
        <img src="image2.jpg" alt="Hockey Movie 2" />
        <img src="image3.jpg" alt="Hockey Movie 3" />
        <img src="image4.jpg" alt="Hockey Movie 4" />
        <img src="image5.jpg" alt="Hockey Movie 5" />
        <img src="image6.jpg" alt="Hockey Movie 6" />
    </div>
</div>
    </main>
    </Section>

    <footer>
    Copyright 2026 <img id="Copyright" src="./assets/vector-copyright-symbol-icon.webp" alt="">    
    </footer>
</body>
</html>
